<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Journal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!--
    The Journal's Cast receiver: what a TV with Google Cast shows when the phone casts to it (docs/cast.md).
    The phone sends each photo and video's original; this page decodes it (HEIC and JPEG XL with the decoders in
    vendor/) and shows the part of it the phone's frame marks. Hosted on GitHub Pages; open with ?local to try it in a
    browser without a TV (receiver/test/).
  -->
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none; }
    canvas, video { position: absolute; inset: 0; width: 100%; height: 100%; }
    canvas { opacity: 0; transition: opacity 450ms ease; }
    canvas.front { opacity: 1; }
    video { object-fit: contain; background: #000; opacity: 0; transition: opacity 300ms ease; }
    video.front { opacity: 1; }
    #idle {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      color: rgba(255, 255, 255, 0.55); font: 300 44px/1 system-ui, sans-serif; letter-spacing: 0.08em;
      transition: opacity 450ms ease;
    }
    #idle.gone { opacity: 0; }
    #note {
      position: absolute; left: 50%; bottom: 6vh; transform: translateX(-50%);
      padding: 10px 22px; border-radius: 999px; background: rgba(0, 0, 0, 0.6);
      color: #fff; font: 400 22px/1.3 system-ui, sans-serif; opacity: 0; transition: opacity 300ms ease;
      max-width: 70vw; text-align: center;
    }
    #note.shown { opacity: 1; }
  </style>
  <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
</head>
<body>
  <div id="idle">Journal</div>
  <canvas id="a"></canvas>
  <canvas id="b"></canvas>
  <video id="video" playsinline preload="auto"></video>
  <div id="note"></div>
  <script type="module" src="receiver.js"></script>
</body>
</html>
