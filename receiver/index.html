<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Journal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!--
    The Journal's Cast receiver: what a TV with Google Cast shows when the phone casts to it (docs/cast.md).
    The phone sends each photo and video's original; this page decodes it (HEIC and JPEG XL with the decoders in
    vendor/) and shows the part of it the phone's frame marks. Hosted on GitHub Pages; open with ?local to try it in a
    browser without a TV (receiver/test/).
  -->
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none; }
    canvas, video { position: absolute; inset: 0; width: 100%; height: 100%; }
    canvas { opacity: 0; transition: opacity 450ms ease; }
    canvas.front { opacity: 1; }
    video { object-fit: contain; background: #000; opacity: 0; transition: opacity 300ms ease; }
    video.front { opacity: 1; }
    #idle {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      color: rgba(255, 255, 255, 0.55); font: 300 44px/1 system-ui, sans-serif; letter-spacing: 0.08em;
      transition: opacity 450ms ease;
    }
    #idle.gone { opacity: 0; }
    #note {
      position: absolute; left: 50%; bottom: 6vh; transform: translateX(-50%);
      padding: 10px 22px; border-radius: 999px; background: rgba(0, 0, 0, 0.6);
      color: #fff; font: 400 22px/1.3 system-ui, sans-serif; opacity: 0; transition: opacity 300ms ease;
      max-width: 70vw; text-align: center;
    }
    #note.shown { opacity: 1; }
    /* A small turning ring in the top corner while a photo or video comes. */
    #busy {
      position: absolute; top: 4vh; right: 3vw; width: 34px; height: 34px; border-radius: 50%;
      border: 4px solid rgba(255, 255, 255, 0.25); border-top-color: rgba(255, 255, 255, 0.9);
      opacity: 0; transition: opacity 250ms ease; animation: turn 0.9s linear infinite;
    }
    #busy.shown { opacity: 1; }
    @keyframes turn { to { transform: rotate(360deg); } }
    /* The photo's note, when and where, over its bottom (the phone's info button). */
    #info {
      position: absolute; left: 0; right: 0; bottom: 0; padding: 12vh 5vw 6vh;
      background: linear-gradient(to bottom, rgba(0, 0, 0, 0), rgba(0, 0, 0, 0.7));
      color: #fff; font-family: system-ui, sans-serif; text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
      opacity: 0; transition: opacity 300ms ease;
    }
    #info.shown { opacity: 1; }
    #info .text { font-size: 34px; line-height: 1.35; max-width: 60vw; white-space: pre-line; margin-bottom: 10px; }
    #info .when { font-size: 24px; color: rgba(255, 255, 255, 0.8); }
    /* Where it was taken, on a map in the corner (the phone's map button). */
    #map {
      position: absolute; right: 4vw; top: 6vh; width: 34vw; height: 42vh; border-radius: 18px; overflow: hidden;
      box-shadow: 0 6px 30px rgba(0, 0, 0, 0.5); opacity: 0; transition: opacity 300ms ease;
    }
    #map.shown { opacity: 1; }
    #map canvas { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 1; transition: none; }
    #map .credit {
      position: absolute; right: 0; bottom: 0; padding: 3px 8px; background: rgba(255, 255, 255, 0.75);
      color: #333; font: 13px system-ui, sans-serif; border-top-left-radius: 8px;
    }
  </style>
  <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
</head>
<body>
  <div id="idle">Journal</div>
  <canvas id="a"></canvas>
  <canvas id="b"></canvas>
  <video id="video" playsinline preload="auto"></video>
  <div id="info"></div>
  <div id="map"><canvas></canvas><div class="credit">© OpenStreetMap contributors</div></div>
  <div id="note"></div>
  <div id="busy"></div>
  <script type="module" src="receiver.js"></script>
</body>
</html>
