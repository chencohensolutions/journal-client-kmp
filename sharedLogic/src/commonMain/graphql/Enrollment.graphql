query EnrollmentPreview($code: String!) {
  enrollmentPreview(code: $code) {
    __typename
    ... on EnrollmentPreview {
      user
      expiresAt
    }
    ... on EnrollmentRejected {
      reason
    }
  }
}

mutation EnrollDevice($input: EnrollDeviceInput!) {
  enrollDevice(input: $input) {
    __typename
    ... on EnrolledDevice {
      user
      deviceName
      certificate
      serial
      expiresAt
    }
    ... on EnrollmentRejected {
      reason
    }
  }
}

# A new certificate for a new key, asked with the current one in its last 30 days (CertificateRenewal).
mutation RenewCertificate($csr: String!, $keyProtection: KeyProtection!) {
  renewCertificate(csr: $csr, keyProtection: $keyProtection) {
    __typename
    ... on EnrolledDevice {
      user
      deviceName
      certificate
      serial
      expiresAt
    }
    ... on EnrollmentRejected {
      reason
    }
  }
}
