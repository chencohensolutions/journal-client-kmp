# Settings › Backup › Copies on other disks: the server's copies of this user's files, on its disks and on friends'
# servers (peers).

fragment DataCopyFields on DataCopy {
  folder
  kind
  encrypted
  realtime
  dailyAt
  sameDisk
  originals
  copied
  missing
  missingBytes
  inCopyOnly
  freeBytes
  checkedAt
  checking
  running { startedAt files bytes counting totalFiles totalBytes doneFiles doneBytes }
  lastPass { startedAt finishedAt files bytes failed stopped }
  problem
  problemSince
}

query ServerCopies {
  copies { ...DataCopyFields }
}

mutation StartCopy($folder: String!) {
  startCopy(folder: $folder) { ...DataCopyFields }
}

mutation StopCopy($folder: String!) {
  stopCopy(folder: $folder) { ...DataCopyFields }
}
