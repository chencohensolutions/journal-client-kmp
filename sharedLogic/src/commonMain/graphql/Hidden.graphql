fragment CollectionFields on Collection {
  name
  files
  hidden
}

fragment HiddenCollectionsFields on HiddenCollections {
  whatsapp { ...CollectionFields }
  screenshotsWithoutApp { ...CollectionFields }
  screenshotApps { ...CollectionFields }
  nudity { hidden from files notScanned }
  recordings { ...CollectionFields }
  calls { ...CollectionFields }
  voiceMessages { ...CollectionFields }
}

query HiddenCollections {
  hiddenCollections { ...HiddenCollectionsFields }
}

mutation SetHiddenCollections($input: HiddenCollectionsInput!) {
  setHiddenCollections(input: $input) { ...HiddenCollectionsFields }
}
