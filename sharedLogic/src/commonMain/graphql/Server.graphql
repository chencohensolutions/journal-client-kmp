query ServerInfo {
  serverInfo {
    api
    version
    search
    previews
    posters
    nudityScan
    faces
    textInPhotos
    similar
    aesthetic
    localIndexes
    indexing
    audio
  }
}

query LocalIndexes {
  localIndexes {
    name
    model
    format
    dim
    files
    bytes
    models { name precision bytes sha256 url }
  }
}
