query ServerInfo {
  serverInfo {
    api
    version
    search
    previews
    posters
    nudityScan
    faces
    textInPhotos
    similar
    aesthetic
    localIndexes
    indexing
    audio
    cameras
    soundFolders
    keepsJpegAsJxl
    copies
  }
}

# Asked on its own: a server from before discovery (journal-server-go PR #4) doesn't know the field, and its error must
# not cost the features above.
query ServerDiscovery {
  serverInfo {
    discovery { fingerprint id key addresses }
  }
}

# Asked on its own, like discovery: a server from before it doesn't know the field.
query ServerVideoFrames {
  serverInfo { videoFrames }
}

# Asked on its own too (Nov 8, 2026): whether files can be tucked away (setTucked, Media.tucked).
query ServerTuckedAway {
  serverInfo { tuckedAway }
}

# Asked on its own too (Nov 8, 2026): whether notes are kept and synced (setNote, Media.note).
query ServerNotes {
  serverInfo { notes }
}

query LocalIndexes {
  localIndexes {
    name
    model
    format
    dim
    files
    bytes
    models { name precision bytes sha256 url source }
  }
}

query PhoneModels {
  phoneModels { name precision bytes sha256 url source }
}

# Asked on its own too (Nov 14, 2026): the CA that signs this server's certificates, kept so the server is trusted by
# it (JournalSettings.serverCa). A server from before it doesn't know the field.
query ServerCa {
  serverInfo { caCertificate }
}
