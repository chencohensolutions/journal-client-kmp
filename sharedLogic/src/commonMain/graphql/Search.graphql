query SearchMedia($text: String!, $limit: Int, $offset: Int, $years: [Int!], $area: GeoAreaInput, $includePrivate: Boolean) {
  searchMedia(text: $text, limit: $limit, offset: $offset, years: $years, area: $area, includePrivate: $includePrivate) {
    hits {
      set
      moment
      media {
        sha256
      }
    }
    indexed
    total
  }
}
