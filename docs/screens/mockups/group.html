<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Group</title>
<link rel="stylesheet" href="mock.css">
<style>
  .cover { position: relative; }
  .cover .bar { position: absolute; left: 0; right: 0; top: 0; display: flex; padding: 28px 8px 30px; color: #FFF; background: linear-gradient(rgba(0, 0, 0, 0.45), transparent); }
  .cover .bar .icon-btn:hover { background: rgba(255, 255, 255, 0.15); }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; }
  .grid button { position: relative; border: none; padding: 0; }
  .cover-mark { position: absolute; left: 6px; top: 6px; padding: 2px 8px; border-radius: 999px; background: var(--accent); color: var(--bg); font-size: 11px; font-weight: 700; }
</style>
</head>
<body>
<div class="phone" v-scope v-cloak>
  <div class="scroll">
    <div class="cover">
      <div v-scope="Photo({ p: items[cover], badges: false })"></div>
      <div class="bar">
        <button class="icon-btn" aria-label="Back" @click="go('story.html')" v-html="icon('back')"></button>
        <span style="flex:1"></span>
        <button class="icon-btn" aria-label="More" @click="menu = !menu" v-html="icon('more')"></button>
      </div>
    </div>
    <div style="padding:16px 16px 8px">
      <div class="small muted">Japan trip</div>
      <h2 style="margin:2px 0 4px;font-size:26px;letter-spacing:-0.02em">{{ title || '2:09 PM' }}</h2>
      <div class="small muted">Oct 9 · 2:09 – 2:10 PM · {{ items.length }} photos</div>
    </div>
    <div style="padding:0 16px 16px">
      <p class="serif" style="margin:0 0 6px" :class="{ muted: !text }">{{ text || 'Write about this moment…' }}</p>
      <button class="btn small text" style="padding:0" @click="editing = true"><span v-html="icon('pencil')"></span>Edit</button>
    </div>
    <div class="grid">
      <button v-for="(p, i) in items" @click="go('viewer.html?from=group')" :aria-label="'Photo' + (i === cover ? ', cover' : '')">
        <div v-scope="Photo({ p })"></div>
        <span v-if="i === cover" class="cover-mark">Cover</span>
      </button>
    </div>
  </div>

  <div class="contents" v-if="menu">
    <button class="backdrop" aria-label="Close menu" @click="menu = false"></button>
    <div class="menu">
      <button @click="menu = false; renaming = title">Rename</button>
      <button @click="go('story.html')">Ungroup</button>
    </div>
  </div>

  <div class="contents" v-if="renaming !== null">
    <button class="backdrop dim" aria-label="Cancel" @click="renaming = null"></button>
    <div class="dialog">
      <h3>Rename group</h3>
      <input class="field" v-model="renaming" placeholder="Title (optional)" aria-label="Title">
      <span class="small muted">A blank title shows the time instead.</span>
      <div class="row-end">
        <button class="btn text" @click="renaming = null">Cancel</button>
        <button class="btn primary" @click="title = renaming.trim(); renaming = null">Save</button>
      </div>
    </div>
  </div>

  <div class="sheet" v-if="editing" style="top:40px;max-height:none">
    <div style="display:flex;justify-content:space-between;align-items:center"><b>Group</b><button class="btn primary small" @click="editing = false">Done</button></div>
    <textarea class="field serif" style="flex:1;padding:12px;height:auto;resize:none" v-model="text" placeholder="Write about this moment…" aria-label="Group text"></textarea>
  </div>
</div>
<script src="vendor/petite-vue.iife.js"></script>
<script src="mock.js"></script>
<script>
  mount({
    title: 'Fixing the car',
    text: 'The car did not start, so the walk waited.',
    items: photos(70, 14, i => ({ ratio: i ? 1 : 3 / 2, status: i < 5 ? 'done' : 'local' })),
    cover: 0,
    menu: false, renaming: null, editing: false,
  });
</script>
</body>
</html>
